name: Feature request
description: Improve an existing ToolsViewer tool
title: "[Feature] "
labels: ["feature-request"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - HTML Viewer Pro
        - Email Viewer
        - RegEx Visualizer & Explainer
        - JSON Formatter & Converter
        - Other / sitewide
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What should change?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does this help?
